name: Build CSO Reader

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bin/src/cso_reader/**'
      - '.github/workflows/build-cso-reader.yml'
  pull_request:
    paths:
      - 'bin/src/cso_reader/**'
      - '.github/workflows/build-cso-reader.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'
    
    - name: Build x64
      working-directory: bin/src/cso_reader
      run: |
        cmake -B build-x64 -G "Visual Studio 17 2022" -A x64
        cmake --build build-x64 --config Release
    
    - name: Build ARM64
      working-directory: bin/src/cso_reader
      run: |
        cmake -B build-arm64 -G "Visual Studio 17 2022" -A ARM64
        cmake --build build-arm64 --config Release
    
    - name: Copy Binaries
      run: |
        mkdir -p bin/cso_reader/win
        cp bin/src/cso_reader/build-x64/Release/cso_reader.exe bin/cso_reader/win/cso_reader.exe
        cp bin/src/cso_reader/build-arm64/Release/cso_reader.exe bin/cso_reader/win/cso_reader-arm64.exe
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cso_reader-windows
        path: bin/cso_reader/win/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential zlib1g-dev
    
    - name: Build
      working-directory: bin/src/cso_reader
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel
    
    - name: Copy Binary
      run: |
        mkdir -p bin/cso_reader/linux
        cp bin/src/cso_reader/build/cso_reader bin/cso_reader/linux/
        chmod +x bin/cso_reader/linux/cso_reader
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cso_reader-linux-x64
        path: bin/cso_reader/linux/cso_reader

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true
    
    - name: Build ARM64
      working-directory: bin/src/cso_reader
      run: |
        cmake -B build-android \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android --parallel
    
    - name: Build ARMv7
      working-directory: bin/src/cso_reader
      run: |
        cmake -B build-android-armv7 \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android-armv7 --parallel
    
    - name: Copy Binaries
      run: |
        mkdir -p bin/cso_reader/android
        cp bin/src/cso_reader/build-android/cso_reader bin/cso_reader/android/cso_reader-arm64.bin
        cp bin/src/cso_reader/build-android-armv7/cso_reader bin/cso_reader/android/cso_reader-armv7.bin
        chmod +x bin/cso_reader/android/*
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cso_reader-android
        path: bin/cso_reader/android/*

  commit-binaries:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Organize binaries
      run: |
        mkdir -p bin/cso_reader/win
        mkdir -p bin/cso_reader/linux
        mkdir -p bin/cso_reader/android
        
        cp artifacts/cso_reader-windows/cso_reader.exe bin/cso_reader/win/ || true
        cp artifacts/cso_reader-windows/cso_reader-arm64.exe bin/cso_reader/win/ || true
        cp artifacts/cso_reader-linux-x64/cso_reader bin/cso_reader/linux/ || true
        cp artifacts/cso_reader-android/cso_reader-arm64.bin bin/cso_reader/android/ || true
        cp artifacts/cso_reader-android/cso_reader-armv7.bin bin/cso_reader/android/ || true
        
        chmod +x bin/cso_reader/linux/cso_reader || true
        chmod +x bin/cso_reader/android/* || true
    
    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add bin/cso_reader/
        git diff --staged --quiet || git commit -m "Update cso_reader binaries"
        git push
