name: Export

# One workflow, three platform jobs (parallel, independently re-runnable),
# plus a release job that attaches all binaries together - a release is
# all-or-nothing, never 2 of 3 platforms.
#
# All jobs run on ubuntu-latest: Godot export templates are self-contained
# prebuilt binaries, so Windows/Linux/Android all export from one Linux
# host, mirroring local exports. Shared Godot setup lives in
# .github/actions/godot-setup and editor/template caches are shared across
# jobs, so the ~1GB of downloads happens once, not per platform.

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: 4.7
  GODOT_BIN: Godot_v4.7-stable_linux.x86_64
  # SHA-256 cert fingerprint of the persistent Android signing key
  # (~/.android/kyodai-release.keystore, mirrored into the
  # ANDROID_KEYSTORE_BASE64 secret). Cert fingerprints aren't sensitive.
  # Godot SILENTLY GENERATES A FRESH DEBUG KEY if the keystore is
  # missing/unreadable, so both the keystore decode and the built APK are
  # asserted against this value - a mismatch fails the build instead of
  # shipping an APK that can't install as an update.
  EXPECTED_KEYSTORE_FP: "24b941952662ff7932ed54cb9e9df325c4990cb922140992dcd0615eaa2f7f50"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: ./.github/actions/godot-setup

    - name: Export Windows
      run: |
        mkdir -p build/windows
        ./godot/${GODOT_BIN} --headless --path . --export-release "Windows Desktop" build/windows/Kyodai.exe

    - name: Package Windows zip
      run: |
        # embed_pck=false: the exe is useless without its .pck and the
        # GDExtension DLLs - the whole folder is the distributable
        cd build/windows
        zip -r "$GITHUB_WORKSPACE/Kyodai-windows-x64.zip" .

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyodai-windows-x64
        path: Kyodai-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: ./.github/actions/godot-setup

    - name: Export Linux
      run: |
        mkdir -p build/linux
        ./godot/${GODOT_BIN} --headless --path . --export-release "Linux/X11" build/linux/Kyodai.x86_64
        chmod +x build/linux/Kyodai.x86_64

    - name: Build AppImage
      env:
        # FUSE is not guaranteed on runners; extract-and-run mode works everywhere
        APPIMAGE_EXTRACT_AND_RUN: 1
        OUTPUT: Kyodai-x86_64.AppImage
      run: |
        sudo apt-get update
        sudo apt-get install -y librsvg2-bin
        mkdir -p "$HOME/.local/bin"
        curl -L -o "$HOME/.local/bin/linuxdeploy" "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        curl -L -o "$HOME/.local/bin/linuxdeploy-plugin-appimage" "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
        chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/linuxdeploy-plugin-appimage"
        export PATH="$HOME/.local/bin:$PATH"
        rsvg-convert -w 256 -h 256 kyodai_icon.svg -o kyodai.png
        mkdir -p AppDir/usr/bin
        # embed_pck=false: binary + pck must both ship in the AppDir
        cp build/linux/Kyodai.x86_64 build/linux/Kyodai.pck AppDir/usr/bin/
        # Godot ships GDExtension libs as loose files beside the exe (never
        # inside the PCK) and dlopens them by filename at startup. Without
        # them SQLite fails to load, data_manager/launch_manager don't
        # compile, and the database never initializes (v0.1a AppImage bug).
        cp build/linux/*.so AppDir/usr/bin/
        linuxdeploy \
          --appdir AppDir \
          --executable AppDir/usr/bin/Kyodai.x86_64 \
          --desktop-file dist/linux/kyodai.desktop \
          --icon-file kyodai.png \
          --output appimage

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyodai-linux-x64
        path: Kyodai-x86_64.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install SDK packages
      run: |
        # ubuntu-latest ships a preinstalled Android SDK at $ANDROID_HOME.
        # (android-actions/setup-android was dropped: it installs the 'tools'
        # package, which Google removed from the SDK repository.)
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0"

    - uses: ./.github/actions/godot-setup

    - name: Configure Android SDK path + signing keystore
      run: |
        # Godot reads the SDK path from editor settings, not the environment
        mkdir -p "$HOME/.config/godot"
        printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android_sdk_path = "%s"\n' "$ANDROID_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
        # Persistent signing key from repo secrets (standard debug-alias
        # credentials, so the preset needs no changes). Every release shares
        # one signature, which is what allows APKs to install as updates over
        # previous releases. Regenerating this key would force all existing
        # installs to uninstall/reinstall - do not rotate casually.
        # NB: Godot 4.7's default debug keystore lives in the editor DATA dir
        # (~/.local/share/godot/keystores/), NOT ~/.android/debug.keystore.
        # Writing there instead is silently ignored: Godot generates a fresh
        # key per CI run and every release gets a unique signature.
        mkdir -p "$HOME/.local/share/godot/keystores"
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.local/share/godot/keystores/debug.keystore"
        # Fail loudly if the decoded keystore is invalid or the wrong key.
        ACTUAL_FP=$(keytool -list -v -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
          -storepass android -alias androiddebugkey | grep -m1 SHA256 \
          | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
        echo "keystore SHA-256: $ACTUAL_FP"
        [ "$ACTUAL_FP" = "$EXPECTED_KEYSTORE_FP" ]

    - name: Export Android APK
      run: |
        mkdir -p build/android
        # Kyodai is used as a home app on handhelds, and AOSP strips PiP
        # support from home-typed activities (ActivityRecord.
        # supportsPictureInPicture() requires a standard/undefined activity
        # type). Godot 4.7's Android template enables PiP unconditionally
        # (manifest flag + GodotApp.isPiPEnabled()->true), so the engine's
        # setup-time setPictureInPictureParams() throws IllegalStateException
        # and crash-loops the app on every cold start as home. Patch PiP off
        # in the build template SOURCE: --install-android-build-template is a
        # no-op unless combined with --export-*, so the generated android/build
        # can't be patched in a separate step (a standalone run silently does
        # nothing and hangs the job on the game process).
        TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
        mkdir -p /tmp/asrc && cd /tmp/asrc
        unzip -o -q "$TPL" src/main/AndroidManifest.xml src/main/java/com/godot/game/GodotApp.java
        sed -i 's/android:supportsPictureInPicture="true"/android:supportsPictureInPicture="false"/' \
          src/main/AndroidManifest.xml
        sed -i '/isPiPEnabled/,/}/s/return true;/return false;/' \
          src/main/java/com/godot/game/GodotApp.java
        zip -q "$TPL" src/main/AndroidManifest.xml src/main/java/com/godot/game/GodotApp.java
        # Fail loudly if the patch didn't land (bash -e: grep exit 1 fails the step)
        unzip -p "$TPL" src/main/AndroidManifest.xml | grep -q 'supportsPictureInPicture="false"'
        unzip -p "$TPL" src/main/java/com/godot/game/GodotApp.java | grep -q 'return false;'
        cd - > /dev/null
        # The preset uses gradle_build=true, so this runs a full Gradle build.
        # --install-android-build-template lays down android/build (gitignored)
        # from the (now patched) export templates before exporting.
        ./godot/${GODOT_BIN} --headless --path . --install-android-build-template \
          --export-debug "Android" build/android/Kyodai.apk
        # Assert the APK carries the persistent signature (see env comment).
        APK_FP=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
          build/android/Kyodai.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
        echo "APK signer SHA-256: $APK_FP"
        [ "$APK_FP" = "$EXPECTED_KEYSTORE_FP" ]

    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyodai-android-apk
        path: build/android/Kyodai.apk

  release:
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Attach to Release
      uses: softprops/action-gh-release@v2
      with:
        # Semver convention: tags with a prerelease suffix (v0.7.0-beta.1)
        # publish as GitHub prereleases (Experimental channel); plain tags
        # (v0.7.0) publish as stable releases.
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          artifacts/kyodai-windows-x64/Kyodai-windows-x64.zip
          artifacts/kyodai-linux-x64/Kyodai-x86_64.AppImage
          artifacts/kyodai-android-apk/Kyodai.apk
