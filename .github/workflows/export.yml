name: Export All

# Single-job release pipeline: one checkout, one Godot install, one import,
# then Windows + Linux + Android exports in sequence - mirroring how local
# exports are done from one Linux machine (Godot export templates are
# self-contained, no Windows/macOS host required).
#
# Replaces the former export-windows.yml / export-linux.yml /
# export-android.yml split, which triple-paid the checkout + editor +
# templates + import cost and gave failures three places to hide.

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: 4.7
  GODOT_BIN: Godot_v4.7-stable_linux.x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup JDK 17 (Android export)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK packages
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0"

    - name: Cache Godot editor
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: godot
        # Shared with test-gavel.yml
        key: godot-editor-v${{ env.GODOT_VERSION }}-stable-linux

    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_BIN}.zip"
        unzip godot.zip -d godot
        chmod +x godot/${GODOT_BIN}

    - name: Cache export templates
      id: cache-templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-templates-v${{ env.GODOT_VERSION }}-stable-linux

    - name: Install Export Templates
      if: steps.cache-templates.outputs.cache-hit != 'true'
      run: |
        curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        mkdir -p templates
        unzip templates.tpz -d templates
        dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
        mkdir -p "$dest"
        cp -r templates/templates/* "$dest"

    - name: Configure Android SDK path + debug keystore
      run: |
        # Godot reads the SDK path from editor settings, not the environment
        mkdir -p "$HOME/.config/godot"
        printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android_sdk_path = "%s"\n' "$ANDROID_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
        # Alpha builds sign with the standard debug keystore (matches Godot's
        # default debug credentials). Switch to a proper upload key via repo
        # secrets before any stable release - key changes force reinstalls.
        mkdir -p "$HOME/.android"
        keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
          -alias androiddebugkey -storepass android -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Import Project
      run: |
        # Run twice: headless --import can exit before the first full scan completes
        ./godot/${GODOT_BIN} --headless --path . --import
        ./godot/${GODOT_BIN} --headless --path . --import

    # --- Windows ---------------------------------------------------------
    - name: Export Windows
      run: |
        mkdir -p build/windows
        ./godot/${GODOT_BIN} --headless --path . --export-release "Windows Desktop" build/windows/Kyodai.exe

    - name: Package Windows zip
      run: |
        # embed_pck=false: the exe is useless without its .pck and the
        # GDExtension DLLs - the whole folder is the distributable
        cd build/windows
        zip -r "$GITHUB_WORKSPACE/Kyodai-windows-x64.zip" .

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyodai-windows-x64
        path: Kyodai-windows-x64.zip

    # --- Linux -----------------------------------------------------------
    - name: Export Linux
      run: |
        mkdir -p build/linux
        ./godot/${GODOT_BIN} --headless --path . --export-release "Linux/X11" build/linux/Kyodai.x86_64
        chmod +x build/linux/Kyodai.x86_64

    - name: Build AppImage
      env:
        # FUSE is not guaranteed on runners; extract-and-run mode works everywhere
        APPIMAGE_EXTRACT_AND_RUN: 1
        OUTPUT: Kyodai-x86_64.AppImage
      run: |
        sudo apt-get update
        sudo apt-get install -y librsvg2-bin
        mkdir -p "$HOME/.local/bin"
        curl -L -o "$HOME/.local/bin/linuxdeploy" "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        curl -L -o "$HOME/.local/bin/linuxdeploy-plugin-appimage" "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
        chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/linuxdeploy-plugin-appimage"
        export PATH="$HOME/.local/bin:$PATH"
        rsvg-convert -w 256 -h 256 icon.svg -o kyodai.png
        mkdir -p AppDir/usr/bin
        # embed_pck=false: binary + pck must both ship in the AppDir
        cp build/linux/Kyodai.x86_64 build/linux/Kyodai.pck AppDir/usr/bin/
        linuxdeploy \
          --appdir AppDir \
          --executable AppDir/usr/bin/Kyodai.x86_64 \
          --desktop-file dist/linux/kyodai.desktop \
          --icon-file kyodai.png \
          --output appimage

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyodai-linux-x64
        path: Kyodai-x86_64.AppImage

    # --- Android ---------------------------------------------------------
    - name: Export Android APK
      run: |
        mkdir -p build/android
        # The preset uses gradle_build=true, so this runs a full Gradle build.
        # --install-android-build-template lays down android/build (gitignored)
        # from the export templates before exporting.
        ./godot/${GODOT_BIN} --headless --path . --install-android-build-template \
          --export-debug "Android" build/android/Kyodai.apk

    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: kyodai-android-apk
        path: build/android/Kyodai.apk

    # --- Release ----------------------------------------------------------
    - name: Attach to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: |
          Kyodai-windows-x64.zip
          Kyodai-x86_64.AppImage
          build/android/Kyodai.apk
