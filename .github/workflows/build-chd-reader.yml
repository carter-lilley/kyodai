name: Build CHD Reader

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bin/libchdr/**'
  pull_request:
    paths:
      - 'bin/libchdr/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'
    
    - name: Build
      working-directory: bin/src/libchdr
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64
        cmake --build build --config Release
    
    - name: Copy Binary
      run: |
        mkdir -p bin/libchdr/win
        cp bin/src/libchdr/build/Release/chd_reader.exe bin/libchdr/win/
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chd_reader-windows-x64
        path: bin/libchdr/win/chd_reader.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Build
      working-directory: bin/src/libchdr
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel
    
    - name: Copy Binary
      run: |
        mkdir -p bin/libchdr/linux
        cp bin/src/libchdr/build/chd_reader bin/libchdr/linux/
        chmod +x bin/libchdr/linux/chd_reader
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chd_reader-linux-x64
        path: bin/libchdr/linux/chd_reader

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true
    
    - name: Build ARM64
      working-directory: bin/src/libchdr
      run: |
        cmake -B build-android \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android --parallel
    
    - name: Build ARMv7
      working-directory: bin/src/libchdr
      run: |
        cmake -B build-android-armv7 \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android-armv7 --parallel
    
    - name: Copy Binaries
      run: |
        mkdir -p bin/libchdr/android
        cp bin/src/libchdr/build-android/chd_reader bin/libchdr/android/chd_reader-arm64
        cp bin/src/libchdr/build-android-armv7/chd_reader bin/libchdr/android/chd_reader-armv7
        chmod +x bin/libchdr/android/*
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chd_reader-android
        path: bin/libchdr/android/*

  release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Prepare Release Assets
      run: |
        mkdir release
        cp artifacts/chd_reader-windows-x64/chd_reader.exe release/chd_reader-windows-x64.exe
        cp artifacts/chd_reader-linux-x64/chd_reader release/chd_reader-linux-x64
        cp artifacts/chd_reader-android/chd_reader-arm64 release/chd_reader-android-arm64
        cp artifacts/chd_reader-android/chd_reader-armv7 release/chd_reader-android-armv7
        chmod +x release/*
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: chd_reader-${{ github.sha }}
        name: CHD Reader Build ${{ github.run_number }}
        files: release/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}