name: Build Logo Detector GDExtension

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - 'addons/logo_detector/**'
      - 'godot-cpp/**'
      - '.github/workflows/build-logo-detector.yml'
  pull_request:
    paths:
      - 'addons/logo_detector/**'
      - 'godot-cpp/**'
      - '.github/workflows/build-logo-detector.yml'
  workflow_dispatch:

env:
  ORT_VERSION: 1.27.0

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache godot-cpp
        id: cache-godot-cpp
        uses: actions/cache@v4
        with:
          path: godot-cpp
          key: windows-godot-cpp-4.3
          restore-keys: |
            windows-godot-cpp-

      - name: Clone godot-cpp
        if: steps.cache-godot-cpp.outputs.cache-hit != 'true'
        run: git clone --recursive --branch 4.3 --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Cache build directory and ONNX Runtime
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            addons/logo_detector/build
            addons/logo_detector/thirdparty/onnxruntime
          key: windows-logo-detector-${{ hashFiles('addons/logo_detector/src/**', 'addons/logo_detector/CMakeLists.txt', '.github/workflows/build-logo-detector.yml') }}
          restore-keys: |
            windows-logo-detector-

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Download ONNX Runtime
        shell: bash
        run: |
          if [ -f "addons/logo_detector/thirdparty/onnxruntime/win/lib/onnxruntime.lib" ]; then
            echo "ONNX Runtime already cached"
            exit 0
          fi
          mkdir -p addons/logo_detector/thirdparty/onnxruntime/win
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-win-x64-${ORT_VERSION}.zip" -o onnxruntime.zip
          unzip -q onnxruntime.zip -d addons/logo_detector/thirdparty/onnxruntime/
          mv addons/logo_detector/thirdparty/onnxruntime/onnxruntime-win-x64-${ORT_VERSION}/* addons/logo_detector/thirdparty/onnxruntime/win/
          rm -rf onnxruntime.zip addons/logo_detector/thirdparty/onnxruntime/onnxruntime-win-x64-${ORT_VERSION}

      - name: Configure
        working-directory: addons/logo_detector
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DONNXRUNTIME_ROOT="${{ github.workspace }}/addons/logo_detector/thirdparty/onnxruntime/win" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: addons/logo_detector
        run: cmake --build build --config Release --parallel 2

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p bin/logo_detector/windows.x86_64
          cp addons/logo_detector/build/Release/liblogo_detector.windows.template_release.x86_64.dll bin/logo_detector/windows.x86_64/
          cp addons/logo_detector/thirdparty/onnxruntime/win/lib/onnxruntime.dll bin/logo_detector/windows.x86_64/
          cp addons/logo_detector/thirdparty/onnxruntime/win/lib/onnxruntime_providers_shared.dll bin/logo_detector/windows.x86_64/

      - name: Verify DLL does not link Debug CRT
        shell: bash
        run: |
          pip install pefile
          python - <<'PY'
          import pefile, sys
          pe = pefile.PE(r'bin/logo_detector/windows.x86_64/liblogo_detector.windows.template_release.x86_64.dll')
          deps = [entry.dll.decode().lower() for entry in pe.DIRECTORY_ENTRY_IMPORT]
          debug_crt = [d for d in deps if d.endswith('d.dll')]
          if debug_crt:
              print('ERROR: logo_detector.dll links against Debug CRT:')
              for d in debug_crt:
                  print('  ', d)
              sys.exit(1)
          print('OK: logo_detector.dll does not link against Debug CRT')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logo_detector-windows
          path: bin/logo_detector/windows.x86_64/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache godot-cpp
        id: cache-godot-cpp
        uses: actions/cache@v4
        with:
          path: godot-cpp
          key: linux-godot-cpp-4.3
          restore-keys: |
            linux-godot-cpp-

      - name: Clone godot-cpp
        if: steps.cache-godot-cpp.outputs.cache-hit != 'true'
        run: git clone --recursive --branch 4.3 --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Cache build directory and ONNX Runtime
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            addons/logo_detector/build
            addons/logo_detector/thirdparty/onnxruntime
          key: linux-logo-detector-${{ hashFiles('addons/logo_detector/src/**', 'addons/logo_detector/CMakeLists.txt', '.github/workflows/build-logo-detector.yml') }}
          restore-keys: |
            linux-logo-detector-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Download ONNX Runtime
        run: |
          if [ -f "addons/logo_detector/thirdparty/onnxruntime/linux/lib/libonnxruntime.so" ]; then
            echo "ONNX Runtime already cached"
            exit 0
          fi
          mkdir -p addons/logo_detector/thirdparty/onnxruntime/linux
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | tar -xz -C addons/logo_detector/thirdparty/onnxruntime/linux --strip-components=1

      - name: Configure
        working-directory: addons/logo_detector
        run: cmake -B build -DONNXRUNTIME_ROOT="${{ github.workspace }}/addons/logo_detector/thirdparty/onnxruntime/linux" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: addons/logo_detector
        run: cmake --build build --parallel 2

      - name: Collect binaries
        run: |
          mkdir -p bin/logo_detector/linux.x86_64
          cp addons/logo_detector/build/liblogo_detector.linux.template_release.x86_64.so bin/logo_detector/linux.x86_64/
          cp addons/logo_detector/thirdparty/onnxruntime/linux/lib/libonnxruntime.so* bin/logo_detector/linux.x86_64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logo_detector-linux
          path: bin/logo_detector/linux.x86_64/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache godot-cpp
        id: cache-godot-cpp
        uses: actions/cache@v4
        with:
          path: godot-cpp
          key: android-godot-cpp-4.3
          restore-keys: |
            android-godot-cpp-

      - name: Clone godot-cpp
        if: steps.cache-godot-cpp.outputs.cache-hit != 'true'
        run: git clone --recursive --branch 4.3 --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Cache build directory and ONNX Runtime
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            addons/logo_detector/build-android-arm64
            addons/logo_detector/thirdparty/onnxruntime/android-arm64
          key: android-arm64-logo-detector-${{ hashFiles('addons/logo_detector/src/**', 'addons/logo_detector/CMakeLists.txt', '.github/workflows/build-logo-detector.yml') }}
          restore-keys: |
            android-arm64-logo-detector-

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Download ONNX Runtime (ARM64)
        run: |
          if [ -f "addons/logo_detector/thirdparty/onnxruntime/android-arm64/libonnxruntime.so" ]; then
            echo "ONNX Runtime already cached"
            exit 0
          fi
          mkdir -p addons/logo_detector/thirdparty/onnxruntime/android-arm64
          curl -L "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar" -o onnxruntime.aar
          unzip -q onnxruntime.aar -d addons/logo_detector/thirdparty/onnxruntime/android-arm64
          rm onnxruntime.aar
          mkdir -p addons/logo_detector/thirdparty/onnxruntime/android-arm64/include
          cp -r addons/logo_detector/thirdparty/onnxruntime/android-arm64/headers/* addons/logo_detector/thirdparty/onnxruntime/android-arm64/include/
          cp addons/logo_detector/thirdparty/onnxruntime/android-arm64/jni/arm64-v8a/libonnxruntime.so addons/logo_detector/thirdparty/onnxruntime/android-arm64/libonnxruntime.so

      - name: Configure ARM64
        working-directory: addons/logo_detector
        run: |
          cmake -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DONNXRUNTIME_ROOT="${{ github.workspace }}/addons/logo_detector/thirdparty/onnxruntime/android-arm64" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build ARM64
        working-directory: addons/logo_detector
        run: cmake --build build-android-arm64 --parallel 2

      - name: Collect binaries
        run: |
          mkdir -p bin/logo_detector/android.arm64
          cp addons/logo_detector/build-android-arm64/liblogo_detector.android.template_release.arm64.so bin/logo_detector/android.arm64/
          cp addons/logo_detector/thirdparty/onnxruntime/android-arm64/libonnxruntime.so bin/logo_detector/android.arm64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logo_detector-android
          path: bin/logo_detector/android.arm64/*

  release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package platform binaries
        run: |
          mkdir -p logo_detector-binaries/windows.x86_64
          mkdir -p logo_detector-binaries/linux.x86_64
          mkdir -p logo_detector-binaries/android.arm64
          mkdir -p logo_detector-binaries/models

          cp artifacts/logo_detector-windows/* logo_detector-binaries/windows.x86_64/
          cp artifacts/logo_detector-linux/* logo_detector-binaries/linux.x86_64/
          cp artifacts/logo_detector-android/* logo_detector-binaries/android.arm64/
          cp addons/logo_detector/models/*.onnx logo_detector-binaries/models/

          zip -r logo_detector-binaries.zip logo_detector-binaries

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: logo-detector-latest
          name: Logo Detector Binaries
          files: logo_detector-binaries.zip
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
