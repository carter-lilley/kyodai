name: Build FATX Tool

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bin/src/fatx_tool/**'
      - '.github/workflows/build-fatx-tool.yml'
  pull_request:
    paths:
      - 'bin/src/fatx_tool/**'
      - '.github/workflows/build-fatx-tool.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'
    
    - name: Build x64
      working-directory: bin/src/fatx_tool
      run: |
        cmake -B build-x64 -G "Visual Studio 17 2022" -A x64
        cmake --build build-x64 --config Release
    
    - name: Build ARM64
      working-directory: bin/src/fatx_tool
      run: |
        cmake -B build-arm64 -G "Visual Studio 17 2022" -A ARM64
        cmake --build build-arm64 --config Release
    
    - name: Copy Binaries
      run: |
        mkdir -p bin/fatx_tool/win
        cp bin/src/fatx_tool/build-x64/Release/fatx_tool.exe bin/fatx_tool/win/fatx_tool.exe
        cp bin/src/fatx_tool/build-arm64/Release/fatx_tool.exe bin/fatx_tool/win/fatx_tool-arm64.exe
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fatx_tool-windows
        path: bin/fatx_tool/win/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Build
      working-directory: bin/src/fatx_tool
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel
    
    - name: Copy Binary
      run: |
        mkdir -p bin/fatx_tool/linux
        cp bin/src/fatx_tool/build/fatx_tool bin/fatx_tool/linux/
        chmod +x bin/fatx_tool/linux/fatx_tool
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fatx_tool-linux-x64
        path: bin/fatx_tool/linux/fatx_tool

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true
    
    - name: Build ARM64
      working-directory: bin/src/fatx_tool
      run: |
        cmake -B build-android \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android --parallel
    
    - name: Build ARMv7
      working-directory: bin/src/fatx_tool
      run: |
        cmake -B build-android-armv7 \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android-armv7 --parallel
    
    - name: Copy Binaries
      run: |
        mkdir -p bin/fatx_tool/android
        cp bin/src/fatx_tool/build-android/fatx_tool bin/fatx_tool/android/fatx_tool-arm64
        cp bin/src/fatx_tool/build-android-armv7/fatx_tool bin/fatx_tool/android/fatx_tool-armv7
        chmod +x bin/fatx_tool/android/*
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fatx_tool-android
        path: bin/fatx_tool/android/*

  commit-binaries:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Organize binaries
      run: |
        mkdir -p bin/fatx_tool/win
        mkdir -p bin/fatx_tool/linux
        mkdir -p bin/fatx_tool/android
        
        cp artifacts/fatx_tool-windows/fatx_tool.exe bin/fatx_tool/win/ || true
        cp artifacts/fatx_tool-windows/fatx_tool-arm64.exe bin/fatx_tool/win/ || true
        cp artifacts/fatx_tool-linux-x64/fatx_tool bin/fatx_tool/linux/ || true
        cp artifacts/fatx_tool-android/fatx_tool-arm64 bin/fatx_tool/android/ || true
        cp artifacts/fatx_tool-android/fatx_tool-armv7 bin/fatx_tool/android/ || true
        
        chmod +x bin/fatx_tool/linux/fatx_tool || true
        chmod +x bin/fatx_tool/android/* || true
    
    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add bin/fatx_tool/
        git diff --staged --quiet || git commit -m "Update fatx_tool binaries"
        git push
